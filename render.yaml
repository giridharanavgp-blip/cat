services:
  - type: web
    name: cat-ai-engine
    runtime: python
    region: oregon
    plan: free
    buildCommand: cd ai-engine && pip install -r requirements.txt
    startCommand: cd ai-engine && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PORT
        value: 10000
